<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSIPTEL — Consulta de Empresa Operadora</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell">
    <!-- Minimal Header -->
    <header class="header">
      <div class="header-brand">
        <span class="dot"></span>
        <h1>Consulta OSIPTEL</h1>
        <span class="subtitle">Empresa operadora y líneas por RUC o DNI</span>
      </div>

      <div class="header-actions">
        <button type="button" id="btnLimpiarTodo" class="btn btn-clear" disabled title="Vaciar toda la lista para hacer nuevas búsquedas">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
          Limpiar lista
        </button>
        <button type="button" id="btnExportCsv" class="btn btn-secondary" disabled>
          CSV
        </button>
        <button type="button" id="btnExportXlsx" class="btn btn-primary" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Descargar Excel
        </button>
      </div>
    </header>

    <!-- Unified Minimal Control Bar -->
    <section class="composer">
      <form id="formConsulta" class="composer-main" novalidate>
        <div class="input-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input
            type="text"
            id="inputDocumentos"
            placeholder="Ingresa un RUC / DNI o pega varios separados por espacio o coma..."
            autocomplete="off"
            aria-label="RUC o DNI a consultar"
          />
          <button type="submit" id="btnConsultar" class="btn btn-dark">
            Consultar
          </button>
        </div>
      </form>

      <div class="composer-divider">o</div>

      <div class="composer-upload">
        <label for="fileExcelInput" class="btn btn-upload" id="dropzoneLabel">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span>Subir Excel (.xlsx)</span>
        </label>
        <input type="file" id="fileExcelInput" accept=".xlsx,.csv,.txt" class="sr-only" />
      </div>
    </section>

    <!-- Thin Minimal Progress Bar -->
    <section id="progressSection" class="progress-strip hidden" aria-live="polite">
      <div class="progress-info">
        <div class="pulse-dot"></div>
        <span id="progressLabel">Consultando en OSIPTEL...</span>
      </div>
      <div class="progress-right">
        <span id="progressCounter" class="mono-text">0 / 0</span>
        <button type="button" id="btnDetener" class="btn-stop">Detener</button>
      </div>
      <div class="progress-track">
        <div id="progressFill" class="progress-fill" style="width: 0%"></div>
      </div>
    </section>

    <!-- Minimal Summary Strip -->
    <section id="summaryStrip" class="summary-strip hidden">
      <div class="stat-item">
        <span class="stat-label">Documentos</span>
        <strong id="statDocs">0</strong>
      </div>
      <div class="stat-item">
        <span class="stat-label">Total líneas</span>
        <strong id="statLines">0</strong>
      </div>

      <div class="stat-filter">
        <input type="search" id="inputFiltroTabla" placeholder="Filtrar por RUC o empresa operadora..." aria-label="Filtrar resultados" />
        <button type="button" id="btnLimpiarSecundario" class="btn-link-danger">
          Vaciar lista
        </button>
      </div>
    </section>

    <!-- Single Clean Results Table -->
    <main class="table-container">
      <table class="minimal-table">
        <thead>
          <tr>
            <th style="width: 190px;">RUC / Documento</th>
            <th>Empresa Operadora (Razón Social OSIPTEL)</th>
            <th class="num" style="width: 120px;">Total Líneas</th>
            <th class="num" style="width: 140px;"></th>
          </tr>
        </thead>
        <tbody id="tbodyResultados">
          <tr>
            <td colspan="4" class="empty-state">
              Escribe un RUC/DNI arriba o sube tu archivo <strong>.xlsx</strong> para consultar sus empresas operadoras.
            </td>
          </tr>
        </tbody>
      </table>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
